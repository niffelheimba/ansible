---
# Discovers Proxmox nodes, QEMU VMs, and LXC containers.
# Proxmox API connection and token values are supplied by the runtime
# environment (locally or through Semaphore). Do not commit them here.
plugin: community.proxmox.proxmox
url: "{{ lookup('ansible.builtin.env', 'PROXMOX_URL') }}"
user: "{{ lookup('ansible.builtin.env', 'PROXMOX_USER') }}"
token_id: "{{ lookup('ansible.builtin.env', 'PROXMOX_TOKEN_ID') }}"
token_secret: "{{ lookup('ansible.builtin.env', 'PROXMOX_TOKEN_SECRET') }}"

validate_certs: true
want_facts: true
want_proxmox_nodes_ansible_host: false

# QEMU guests are excluded from the guest update playbook unless listed here.
# LXC containers are updated through the plugin's proxmox_all_lxc group.
groups:
  essential_vms: >-
    proxmox_vmtype == 'qemu' and
    proxmox_name == 'home-vm-proxyauth-01'

keyed_groups:
  - key: proxmox_node
    prefix: proxmox_node
  - key: proxmox_vmtype
    prefix: proxmox_type
  - key: proxmox_tags_parsed
    prefix: proxmox_tag
    separator: "_"
