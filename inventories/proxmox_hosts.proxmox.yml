---
# Discovers Proxmox VE cluster nodes only. In the current stable plugin,
# filters apply to guests while nodes remain included unless exclude_nodes is
# enabled, so rejecting every guest produces a node-only inventory.
# API connection and token values are supplied by the runtime environment.
plugin: community.proxmox.proxmox
url: "{{ lookup('ansible.builtin.env', 'PROXMOX_URL') }}"
user: "{{ lookup('ansible.builtin.env', 'PROXMOX_USER') }}"
token_id: "{{ lookup('ansible.builtin.env', 'PROXMOX_TOKEN_ID') }}"
token_secret: "{{ lookup('ansible.builtin.env', 'PROXMOX_TOKEN_SECRET') }}"

validate_certs: true
want_facts: false
want_proxmox_nodes_ansible_host: false
exclude_nodes: false

filters:
  - "false"
