---
- name: Reboot updated Proxmox guests when required
  hosts: proxmox_guests
  become: true
  gather_facts: false
  serial: "25%"
  max_fail_percentage: 100

  pre_tasks:
    - name: Skip guests that are not running
      ansible.builtin.meta: end_host
      when: (proxmox_status | default("running")) != "running"

  tasks:
    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Reboot and wait for the guest to return
      ansible.builtin.reboot:
        msg: Reboot initiated by Ansible after package updates
        connect_timeout: 10
        reboot_timeout: 900
        pre_reboot_delay: 5
        post_reboot_delay: 15
        test_command: /usr/bin/true
      when: reboot_required_file.stat.exists

    - name: Report guests that did not require a reboot
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} does not require a reboot."
      when: not reboot_required_file.stat.exists
