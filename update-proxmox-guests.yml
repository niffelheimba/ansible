---
- name: Update ordinary Linux VMs and LXC containers
  hosts: proxmox_guests
  become: true
  gather_facts: false

  vars:
    apt_cache_valid_time: 3600

  pre_tasks:
    - name: Gather operating system facts
      ansible.builtin.setup:

    - name: Verify that the target uses the Debian package family
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == "Debian"
        fail_msg: >-
          {{ inventory_hostname }} uses {{ ansible_facts.os_family }}, not the
          Debian package family. It was not updated by this playbook.

  tasks:
    - name: Update the APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: "{{ apt_cache_valid_time }}"
        update_cache_retries: 5

    - name: Install all available package upgrades
      ansible.builtin.apt:
        upgrade: safe
        dpkg_options: force-confdef,force-confold
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Report systems that require a reboot
      ansible.builtin.debug:
        msg: "A reboot is required for {{ inventory_hostname }}."
      when: reboot_required_file.stat.exists
