---
- name: Update ordinary Linux VMs and LXC containers
  hosts: proxmox_guests
  become: true
  gather_facts: false

  vars:
    apt_cache_valid_time: 3600

  pre_tasks:
    - name: Gather operating system facts
      ansible.builtin.setup:

    - name: Verify that the target uses the Debian package family
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == "Debian"
        fail_msg: >-
          {{ inventory_hostname }} uses {{ ansible_facts.os_family }}, not the
          Debian package family. It was not updated by this playbook.

  tasks:
    - name: Update the APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: "{{ apt_cache_valid_time }}"
        update_cache_retries: 5

    - name: Install all available package upgrades
      ansible.builtin.apt:
        upgrade: safe
        dpkg_options: force-confdef,force-confold
      environment:
        DEBIAN_FRONTEND: noninteractive
      register: package_upgrade
      ignore_unreachable: true

    - name: Discard the previous SSH connection
      ansible.builtin.meta: reset_connection

    - name: Wait for SSH after package upgrades
      ansible.builtin.wait_for_connection:
        delay: 2
        timeout: 180

    - name: Verify package database consistency
      ansible.builtin.command: dpkg --audit
      changed_when: false
      register: dpkg_audit
      failed_when: (dpkg_audit.stdout | trim | length) > 0

    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Report systems that require a reboot
      ansible.builtin.debug:
        msg: "A reboot is required for {{ inventory_hostname }}."
      when: reboot_required_file.stat.exists

    - name: Record verified update completion for the security dashboard
      ansible.builtin.import_tasks: tasks/record-successful-update.yml
      vars:
        maintenance_upgrade_result: "{{ package_upgrade }}"
        maintenance_update_playbook: update-proxmox-guests.yml
